<!doctype html>

<html>
<head>
  <meta charset="utf-8" />
  <title>Car on OSM</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    html,body,#map{height:100%;margin:0}
    .controls{
      position: absolute; right: 12px; bottom: 12px; z-index: 1000;
      background: rgba(255,255,255,0.9); padding: 8px 10px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-family: system-ui, sans-serif;
    }
    /* Camera overlay (top-left) */
    .cameraOverlay{
      position: absolute; left: 12px; top: 12px; z-index: 1000;
      background: rgba(0,0,0,0.45); padding: 6px; border-radius: 10px;
      backdrop-filter: blur(2px);
    }
    /* switched from <img> to <canvas> */
    .cameraOverlay canvas{
      display: block; width: 640px; height: 360px; border-radius: 8px;
      image-rendering: crisp-edges; image-rendering: pixelated;
    }
    .cameraOverlay .label{
      margin-top: 4px; color: white; font: 12px/1.2 system-ui, sans-serif; opacity: 0.9; text-align:center;
    }
    .arrowMarker svg{
      width: 40px; height: 40px;
      transition: transform 80ms linear;   /* smooth heading updates */
      transform-origin: 50% 50%;
      display: block;
    }
    /* IMU graphs container */
    .imuGraphs{
      position: absolute; left: 12px; bottom: 12px; z-index: 1000;
      background: rgba(255,255,255,0.95); padding: 10px; border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .graphContainer{
      margin-bottom: 10px;
    }
    .graphContainer:last-child{
      margin-bottom: 0;
    }
    .graphContainer canvas{
      display: block; border: 1px solid #ccc; border-radius: 4px;
      background: white;
    }
    .graphContainer .graphLabel{
      margin-bottom: 4px; font: bold 12px system-ui, sans-serif; color: #333;
    }
    .graphContainer .legend{
      margin-top: 4px; font: 10px system-ui, sans-serif; color: #666;
    }
  </style>
</head>
<body>
<div id="map"></div>
<div class="controls">
  <button id="toggleFollow">Stop follow</button>
</div>

<!-- Camera overlay -->
<div class="cameraOverlay">
  <canvas id="camCanvas"></canvas>
  <div class="label">/cam1/camera/color/image_raw</div>
</div>

<!-- IMU graphs -->
<div class="imuGraphs">
  <div class="graphContainer">
    <div class="graphLabel">Linear Acceleration (m/s²)</div>
    <canvas id="accelCanvas" width="400" height="120"></canvas>
    <div class="legend">X: red, Y: green, Z: blue</div>
  </div>
  <div class="graphContainer">
    <div class="graphLabel">Angular Velocity (rad/s)</div>
    <canvas id="gyroCanvas" width="400" height="120"></canvas>
    <div class="legend">X: red, Y: green, Z: blue</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>
<script>
  // Copyright 2025 Distance Technologies Oy. For internal use only.
  //
  // Connect to rosbridge on localhost:9090 (change host if needed)
  const ros = new ROSLIB.Ros({url: 'ws://localhost:9090'});

  // Leaflet map
  const map = L.map('map').setView([0,0], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);

  // const carIcon = L.circleMarker([0,0], {radius:6});
  // carIcon.addTo(map);
  
  // Arrow icon pointing "north" by default; we rotate it via CSS.
  const arrowIcon = L.divIcon({
    className: 'arrowMarker',
    iconSize: [40,40],
    iconAnchor: [20,20],
    html: `
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <!-- simple arrow/triangle with a tail -->
        <polygon points="50,5 85,70 65,70 65,95 35,95 35,70 15,70" fill="red" stroke="black" stroke-width="3"/>
      </svg>`
  });

  const carIcon = L.marker([0,0], { icon: arrowIcon, interactive: false, zIndexOffset: 1000 }).addTo(map);

  // helper to set heading (degrees clockwise from north)
  function setHeadingDeg(deg){
    const el = carIcon.getElement();
    if (!el) return;
    const svg = el.querySelector('svg');
    if (svg) svg.style.transform = `rotate(${deg}deg)`;
  }

  // Blue arrow icon for second car
  const blueArrowIcon = L.divIcon({
    className: 'arrowMarker',
    iconSize: [40,40],
    iconAnchor: [20,20],
    html: `
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <!-- simple arrow/triangle with a tail -->
        <polygon points="50,5 85,70 65,70 65,95 35,95 35,70 15,70" fill="blue" stroke="black" stroke-width="3"/>
      </svg>`
  });

  const blueCarIcon = L.marker([0,0], { icon: blueArrowIcon, interactive: false, zIndexOffset: 999 }).addTo(map);

  // helper to set heading for blue car (degrees clockwise from north)
  function setBlueHeadingDeg(deg){
    const el = blueCarIcon.getElement();
    if (!el) return;
    const svg = el.querySelector('svg');
    if (svg) svg.style.transform = `rotate(${deg}deg)`;
  }


  // ===== ODOMETRY -> heading =====
// Change 'name' if your odom topic differs
const odomTopic = new ROSLIB.Topic({
  ros,
  name: '/Inertial_Labs/odom',
  messageType: 'nav_msgs/Odometry'
});

// Quaternion -> yaw (rad), ROS REP-103 (ENU)
function yawFromQuat(q){
  // q = {x,y,z,w}
  const siny_cosp = 2*(q.w*q.z + q.x*q.y);
  const cosy_cosp = 1 - 2*(q.y*q.y + q.z*q.z);
  return Math.atan2(siny_cosp, cosy_cosp); 
  // [-pi, pi]
}

let lastBearingDeg = 0;

odomTopic.subscribe(msg => {
  try{
    const q = msg.pose.pose.orientation || {};
    const yaw = yawFromQuat(q);                   // yaw=0 when pointing +X (East) in ENU
    const yawDeg = yaw * 180/Math.PI;
    // Convert ENU yaw (0=East, CCW+) -> compass bearing (0=North, CW+)
    let bearingDeg = (450-yawDeg) % 360 ;
    if (bearingDeg < 0) bearingDeg += 360;
    
    // optional: tiny deadband to avoid jitter
    // if (Math.abs(bearingDeg - lastBearingDeg) > 0.1){
    setHeadingDeg(bearingDeg);
    lastBearingDeg = bearingDeg;
    console.log(bearingDeg);
    // }
  }catch(e){ console.error(e); }
});

// ===== BLUE CAR ODOMETRY -> heading =====
const blueOdomTopic = new ROSLIB.Topic({
  ros,
  name: '/osm_align/odom',
  messageType: 'nav_msgs/Odometry'
});

let lastBlueBearingDeg = 0;

blueOdomTopic.subscribe(msg => {
  try{
    const q = msg.pose.pose.orientation || {};
    const yaw = yawFromQuat(q);
    const yawDeg = yaw * 180/Math.PI;
    let bearingDeg = (450-yawDeg) % 360 ;
    if (bearingDeg < 0) bearingDeg += 360;
    
    setBlueHeadingDeg(bearingDeg);
    lastBlueBearingDeg = bearingDeg;
  }catch(e){ console.error(e); }
});


  let first = true;
  let follow = true;  // start in follow mode

  // Subscribe directly to NavSatFix topic (interpreted as object structure, not GeoJSON)
  // Keeping topic name '/osm_align/car_geojson', type sensor_msgs/NavSatFix over rosbridge
  const gpsTopic = new ROSLIB.Topic({
    ros: ros,
    name: '/Inertial_Labs/gps_data_std',
    // name: '/Inertial_Labs/gps_data_raw_std',
    messageType: 'sensor_msgs/NavSatFix'
  });

  const path = L.polyline([], { weight: 3, opacity: 0.9,color:'green'}).addTo(map);
  const trail = [];
  const MAX_POINTS = 5000;           // cap to prevent unbounded growth
  const MIN_DIST_M = 0.5;            // only append if moved > 0.5 m (optional smoothing)

  // Controls
  const btnFollow = document.getElementById('toggleFollow');

  btnFollow.onclick = () => {
    follow = !follow;
    btnFollow.textContent = follow ? 'Stop follow' : 'Start follow';
  };

  // Stop following if user drags; double-click to re-enable follow
  map.on('dragstart', () => { follow = false; btnFollow.textContent = 'Start follow'; });
  map.on('dblclick', () => { follow = true; btnFollow.textContent = 'Stop follow'; });

  // Simple Haversine distance in meters
  function distMeters(a, b) {
    const toRad = d => d * Math.PI / 180;
    const R = 6371000;
    const dLat = toRad(b[0] - a[0]);
    const dLon = toRad(b[1] - a[1]);
    const lat1 = toRad(a[0]), lat2 = toRad(b[0]);
    const s = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }

  // GPS: message is ROS NavSatFix
  gpsTopic.subscribe(msg => {
    try {
      const lat = msg.latitude;
      const lon = msg.longitude;
      if (!lat || !lon) return;
      carIcon.setLatLng([lat, lon]);
      
      if (first) { map.setView([lat, lon], 20); first = false; }
      const ll = [lat, lon];

      // Append to trail if moved enough or first point
      const last = trail[trail.length - 1];
      if (!last || distMeters(last, ll) >= MIN_DIST_M) {
        trail.push(ll);
        if (trail.length > MAX_POINTS) trail.shift(); // keep it bounded
        path.setLatLngs(trail);
      }

      if (follow) {
        map.setView([lat, lon], map.getZoom());
      }
    } catch (e) {
      console.error(e);
    }
  });

  // ===== BLUE CAR GPS =====
  const blueGpsTopic = new ROSLIB.Topic({
    ros: ros,
     name: '/osm_align/gps',
    
    messageType: 'sensor_msgs/NavSatFix'
  });

  const bluePath = L.polyline([], { weight: 3, opacity: 0.9, color: 'blue' }).addTo(map);
  const blueTrail = [];

  blueGpsTopic.subscribe(msg => {
    try {
      const lat = msg.latitude;
      const lon = msg.longitude;
      if (!lat || !lon) return;
      blueCarIcon.setLatLng([lat, lon]);
      
      const ll = [lat, lon];

      // Append to trail if moved enough or first point
      const last = blueTrail[blueTrail.length - 1];
      if (!last || distMeters(last, ll) >= MIN_DIST_M) {
        blueTrail.push(ll);
        if (blueTrail.length > MAX_POINTS) blueTrail.shift(); // keep it bounded
        bluePath.setLatLngs(blueTrail);
      }
    } catch (e) {
      console.error(e);
    }
  });

  // ===== RAW IMAGE -> Canvas (sensor_msgs/Image, rgb8) =====
  const camCanvas = document.getElementById('camCanvas');
  const ctx = camCanvas.getContext('2d', { willReadFrequently: false });

  // Helper: Uint8Array from rosbridge field (array or base64 string)
  function bytesFrom(dataField) {
    if (dataField == null) return new Uint8Array();
    if (Array.isArray(dataField)) return new Uint8Array(dataField);
    if (typeof dataField === 'string') {
      const bstr = atob(dataField);
      const arr = new Uint8Array(bstr.length);
      for (let i = 0; i < bstr.length; i++) arr[i] = bstr.charCodeAt(i);
      return arr;
    }
    if (dataField.buffer && dataField.byteLength !== undefined) return new Uint8Array(dataField);
    return new Uint8Array();
  }

  function renderImage(msg) {
    const w = msg.width, h = msg.height;
    if (!w || !h) return;

    // Ensure canvas internal resolution matches the incoming frame
    if (camCanvas.width !== w || camCanvas.height !== h) {
      camCanvas.width = w; camCanvas.height = h;
    }

    const encoding = (msg.encoding || 'rgb8').toLowerCase();
    const step = msg.step || (encoding.includes('rgb') ? w * 3 : w);
    const src = bytesFrom(msg.data);

    // Output RGBA buffer
    const out = new Uint8ClampedArray(w * h * 4);

    if (encoding === 'rgb8') {
      for (let row = 0; row < h; row++) {
        const srcRowStart = row * step;
        const dstRowStart = row * w * 4;
        for (let col = 0; col < w; col++) {
          const si = srcRowStart + col * 3;
          const di = dstRowStart + col * 4;
          out[di]   = src[si];     // R
          out[di+1] = src[si+1];   // G
          out[di+2] = src[si+2];   // B
          out[di+3] = 255;         // A
        }
      }
    } else if (encoding === 'bgr8') {
      for (let row = 0; row < h; row++) {
        const srcRowStart = row * step;
        const dstRowStart = row * w * 4;
        for (let col = 0; col < w; col++) {
          const si = srcRowStart + col * 3;
          const di = dstRowStart + col * 4;
          out[di]   = src[si+2];
          out[di+1] = src[si+1];
          out[di+2] = src[si];
          out[di+3] = 255;
        }
      }
    } else if (encoding === 'mono8') {
      for (let row = 0; row < h; row++) {
        const srcRowStart = row * step;
        const dstRowStart = row * w * 4;
        for (let col = 0; col < w; col++) {
          const v = src[srcRowStart + col];
          const di = dstRowStart + col * 4;
          out[di] = out[di+1] = out[di+2] = v;
          out[di+3] = 255;
        }
      }
    } else {
      console.warn('Unsupported encoding:', encoding, '(expected rgb8/bgr8/mono8).');
      return;
    }

    ctx.putImageData(new ImageData(out, w, h), 0, 0);
  }

  // Subscribe to the raw image (omit messageType to dodge ROS1/ROS2 string mismatch)
  const imageTopic = new ROSLIB.Topic({
    ros,
    name: '/cam1/camera/color/image_raw'
  });

  // Throttle to ~10 FPS
  let lastFrameTs = 0;
  const minFrameGapMs = 10;
  imageTopic.subscribe(msg => {
    const now = performance.now();
    if (now - lastFrameTs < minFrameGapMs) return;
    lastFrameTs = now;

    try {
      renderImage(msg);
    } catch (e) {
      console.error(e);
    }
  });

  // ===== IMU GRAPHS =====
  const accelCanvas = document.getElementById('accelCanvas');
  const accelCtx = accelCanvas.getContext('2d');
  const gyroCanvas = document.getElementById('gyroCanvas');
  const gyroCtx = gyroCanvas.getContext('2d');

  const graphWidth = 400;
  const graphHeight = 120;
  const maxPoints = 200;  // number of data points to show

  // Data arrays for acceleration
  const accelData = {
    x: [],
    y: [],
    z: []
  };

  // Data arrays for gyro
  const gyroData = {
    x: [],
    y: [],
    z: []
  };

  // Draw a graph
  function drawGraph(ctx, data, width, height, title) {
    // Clear canvas
    ctx.clearRect(0, 0, width, height);
    
    // Background
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, width, height);

    // Find min/max for scaling
    let allValues = [...data.x, ...data.y, ...data.z];
    if (allValues.length === 0) return;
    
    let minVal = Math.min(...allValues);
    let maxVal = Math.max(...allValues);
    
    // Add some padding to the range
    const range = maxVal - minVal;
    if (range < 0.1) {
      minVal -= 0.05;
      maxVal += 0.05;
    } else {
      minVal -= range * 0.1;
      maxVal += range * 0.1;
    }

    // Draw grid lines
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = (height / 4) * i;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(width, y);
      ctx.stroke();
    }

    // Draw zero line if in range
    if (minVal <= 0 && maxVal >= 0) {
      const zeroY = height - ((0 - minVal) / (maxVal - minVal)) * height;
      ctx.strokeStyle = '#999';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, zeroY);
      ctx.lineTo(width, zeroY);
      ctx.stroke();
    }

    // Function to draw a line
    function drawLine(values, color) {
      if (values.length < 2) return;
      
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      
      const pointSpacing = width / maxPoints;
      
      for (let i = 0; i < values.length; i++) {
        const x = i * pointSpacing;
        const normalizedY = (values[i] - minVal) / (maxVal - minVal);
        const y = height - (normalizedY * height);
        
        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }
      ctx.stroke();
    }

    // Draw lines for x, y, z
    drawLine(data.x, 'red');
    drawLine(data.y, 'green');
    drawLine(data.z, 'blue');

    // Draw scale labels
    ctx.fillStyle = '#666';
    ctx.font = '10px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(maxVal.toFixed(2), width - 2, 10);
    ctx.fillText(minVal.toFixed(2), width - 2, height - 2);
  }

  // Subscribe to IMU data
  const imuTopic = new ROSLIB.Topic({
    ros,
    name: '/Inertial_Labs/imu_data_std',
    messageType: 'sensor_msgs/Imu'
  });

  imuTopic.subscribe(msg => {
    try {
      // Linear acceleration
      if (msg.linear_acceleration) {
        accelData.x.push(msg.linear_acceleration.x);
        accelData.y.push(msg.linear_acceleration.y);
        accelData.z.push(msg.linear_acceleration.z);
        
        // Keep only last maxPoints
        if (accelData.x.length > maxPoints) {
          accelData.x.shift();
          accelData.y.shift();
          accelData.z.shift();
        }
        
        drawGraph(accelCtx, accelData, graphWidth, graphHeight, 'Acceleration');
      }

      // Angular velocity
      if (msg.angular_velocity) {
        gyroData.x.push(msg.angular_velocity.x);
        gyroData.y.push(msg.angular_velocity.y);
        gyroData.z.push(msg.angular_velocity.z);
        
        // Keep only last maxPoints
        if (gyroData.x.length > maxPoints) {
          gyroData.x.shift();
          gyroData.y.shift();
          gyroData.z.shift();
        }
        
        drawGraph(gyroCtx, gyroData, graphWidth, graphHeight, 'Gyro');
      }
    } catch (e) {
      console.error('IMU data error:', e);
    }
  });

</script>
</body>
</html>
